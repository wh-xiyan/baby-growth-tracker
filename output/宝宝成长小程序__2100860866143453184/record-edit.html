<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config={theme:{extend:{colors:{ink:'#403b39',coral:'#e79576',muted:'#a49b95'}}}};</script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#fffaf5;color:#403b39;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.panel-hidden{display:none}.choice-active{background:#fff0eb;color:#c96f59;border-color:#e79576}.main-active{background:#fff0eb;color:#c96f59}.toast-hidden{opacity:0;pointer-events:none;transform:translateY(8px)}.toast{transition:all .2s ease}
  </style>
</head>
<body>
  <main class="min-h-screen bg-[#fffaf5] pb-8">
    <header class="flex items-center justify-between px-5 pb-4 pt-5"><button id="back-button" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-[#665d58] shadow-[0_8px_24px_rgba(188,135,108,0.1)]"><i class="fa-solid fa-chevron-left text-sm"></i></button><div class="flex flex-col items-center gap-1"><h1 class="text-[18px] font-semibold tracking-[1px]">记录今天</h1><span class="text-[12px] text-[#a49b95]">2026年9月22日 · 星期二</span></div><button id="date-button" type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-[#e79576] shadow-[0_8px_24px_rgba(188,135,108,0.1)]"><i class="fa-regular fa-calendar"></i></button></header>
    <section class="flex flex-col gap-4 px-5">
      <div class="grid grid-cols-4 gap-1 rounded-[16px] bg-[#f6eee9] p-1">
        <button id="tab-feed" type="button" class="main-active flex flex-col items-center gap-1 rounded-[12px] px-1 py-3 text-[12px] font-medium"><i class="fa-solid fa-bottle-water text-[16px]"></i><span>喂养</span></button>
        <button id="tab-sleep" type="button" class="flex flex-col items-center gap-1 rounded-[12px] px-1 py-3 text-[12px] text-[#8e837d]"><i class="fa-solid fa-moon text-[16px]"></i><span>睡眠</span></button>
        <button id="tab-growth" type="button" class="flex flex-col items-center gap-1 rounded-[12px] px-1 py-3 text-[12px] text-[#8e837d]"><i class="fa-solid fa-ruler-vertical text-[16px]"></i><span>成长</span></button>
        <button id="tab-moment" type="button" class="flex flex-col items-center gap-1 rounded-[12px] px-1 py-3 text-[12px] text-[#8e837d]"><i class="fa-solid fa-camera-retro text-[16px]"></i><span>瞬间</span></button>
      </div>

      <section id="feed-panel" class="flex flex-col gap-4 rounded-[20px] bg-white p-5 shadow-[0_8px_24px_rgba(188,135,108,0.1)]">
        <div class="flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-bottle-water text-[#e79576]"></i><h2 class="text-[16px] font-semibold">喂养记录</h2></div><div id="feed-method-labels"><span id="feed-method-placeholder" class="rounded-full bg-[#fff0eb] px-3 py-1 text-[12px] text-[#c96f59]">选择喂养方式</span><span id="feed-method-breast" class="panel-hidden rounded-full bg-[#fff0eb] px-3 py-1 text-[12px] text-[#c96f59]">已选 · 母乳</span><span id="feed-method-formula" class="panel-hidden rounded-full bg-[#fff0eb] px-3 py-1 text-[12px] text-[#c96f59]">已选 · 配方奶</span><span id="feed-method-solid" class="panel-hidden rounded-full bg-[#fff0eb] px-3 py-1 text-[12px] text-[#c96f59]">已选 · 辅食</span></div></div>
        <div class="grid grid-cols-3 gap-2 rounded-[14px] bg-[#f6eee9] p-1"><button id="feed-breast" type="button" class="choice-active rounded-[11px] border px-2 py-2.5 text-[12px] font-medium">母乳</button><button id="feed-formula" type="button" class="rounded-[11px] border border-transparent px-2 py-2.5 text-[12px] text-[#8e837d]">配方奶</button><button id="feed-solid" type="button" class="rounded-[11px] border border-transparent px-2 py-2.5 text-[12px] text-[#8e837d]">辅食</button></div>
        <div id="breast-panel" class="flex flex-col gap-4"><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">喂养时间</label><button type="button" class="flex h-12 items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4"><span>10:30</span><i class="fa-regular fa-clock text-[#a49b95]"></i></button></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">喂养侧</label><div class="grid grid-cols-2 gap-2"><button id="breast-left" type="button" class="choice-active rounded-[13px] border px-4 py-3 text-[13px]">左侧</button><button id="breast-right" type="button" class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#8e837d]">右侧</button></div></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">喂养时长</label><div class="flex items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3"><span class="text-[20px] font-semibold">15</span><span class="text-[12px] text-[#a49b95]">分钟</span></div></div><div class="rounded-[13px] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#a49b95]">记录宝宝吃奶状态或需要备注的内容</div></div>
        <div id="formula-panel" class="panel-hidden flex flex-col gap-4"><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">喂养时间</label><button type="button" class="flex h-12 items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4"><span>10:30</span><i class="fa-regular fa-clock text-[#a49b95]"></i></button></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">奶量</label><div class="flex items-center gap-3"><div class="flex flex-1 items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3"><span class="text-[22px] font-semibold">120</span><span class="text-[13px] text-[#a49b95]">ml</span></div><button id="formula-minus" type="button" class="flex h-11 w-11 items-center justify-center rounded-[12px] bg-[#f6eee9] text-[#c96f59]"><i class="fa-solid fa-minus"></i></button><button id="formula-plus" type="button" class="flex h-11 w-11 items-center justify-center rounded-[12px] bg-[#fff0eb] text-[#c96f59]"><i class="fa-solid fa-plus"></i></button></div></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">奶粉品牌 <span class="text-[#c3b9b2]">（选填）</span></label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#b2a8a2]">输入或选择奶粉品牌</div></div></div>
        <div id="solid-panel" class="panel-hidden flex flex-col gap-4"><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">喂养时间</label><button type="button" class="flex h-12 items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4"><span>12:00</span><i class="fa-regular fa-clock text-[#a49b95]"></i></button></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">辅食类型</label><div class="grid grid-cols-3 gap-2"><button id="solid-rice" type="button" class="choice-active rounded-[13px] border px-2 py-3 text-[12px]">米糊</button><button id="solid-veg" type="button" class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-2 py-3 text-[12px] text-[#8e837d]">菜泥</button><button id="solid-meat" type="button" class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-2 py-3 text-[12px] text-[#8e837d]">肉泥</button></div></div><div id="rice-detail" class="rounded-[13px] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#8e837d]">米糊品牌或配方：<span class="text-[#b2a8a2]">填写米糊名称</span></div><div id="veg-detail" class="panel-hidden flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">蔬菜名称</label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#b2a8a2]">例如：南瓜、西兰花、胡萝卜</div></div><div id="meat-detail" class="panel-hidden flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">肉类名称</label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#b2a8a2]">例如：鸡肉、猪肉、牛肉</div></div><div class="flex items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3"><span class="text-[13px] text-[#665d58]">进食量</span><span class="font-semibold">半碗 <small class="font-normal text-[#a49b95]">约80g</small></span></div></div>
      </section>

      <section id="sleep-panel" class="panel-hidden flex flex-col gap-4 rounded-[20px] bg-white p-5 shadow-[0_8px_24px_rgba(188,135,108,0.1)]"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-moon text-[#8ea6c6]"></i><h2 class="text-[16px] font-semibold">睡眠记录</h2></div><span class="rounded-full bg-[#eef5fb] px-3 py-1 text-[12px] text-[#6e8bab]">记录一觉</span></div><div class="grid grid-cols-2 gap-3"><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">入睡时间</label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3">13:20</div></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">醒来时间</label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3">15:05</div></div></div><div class="flex items-center justify-between rounded-[13px] bg-[#eef8f8] px-4 py-3"><span class="text-[13px] text-[#648b8d]">本次睡眠时长</span><strong class="text-[20px] text-[#4e7f82]">1小时45分</strong></div><div class="rounded-[13px] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#a49b95]">可补充睡眠质量或夜醒次数</div></section>
      <section id="growth-panel" class="panel-hidden flex flex-col gap-4 rounded-[20px] bg-white p-5 shadow-[0_8px_24px_rgba(188,135,108,0.1)]"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-ruler-vertical text-[#82a987]"></i><h2 class="text-[16px] font-semibold">成长记录</h2></div><span class="rounded-full bg-[#eef7ed] px-3 py-1 text-[12px] text-[#62866a]">身体数据</span></div><div class="grid grid-cols-2 gap-3"><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">身高</label><div class="flex items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3"><span class="text-[20px] font-semibold">72.5</span><span class="text-[12px] text-[#a49b95]">cm</span></div></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">体重</label><div class="flex items-center justify-between rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3"><span class="text-[20px] font-semibold">9.2</span><span class="text-[12px] text-[#a49b95]">kg</span></div></div></div><div class="flex flex-col gap-2"><label class="text-[13px] text-[#665d58]">成长里程碑</label><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-3 text-[13px] text-[#b2a8a2]">今天第一次自己站起来啦</div></div></section>
      <section id="moment-panel" class="panel-hidden flex flex-col gap-4 rounded-[20px] bg-white p-5 shadow-[0_8px_24px_rgba(188,135,108,0.1)]"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-camera-retro text-[#c98ca1]"></i><h2 class="text-[16px] font-semibold">记录瞬间</h2></div><span class="rounded-full bg-[#f9edf2] px-3 py-1 text-[12px] text-[#a56b81]">照片与文字</span></div><div class="flex h-32 flex-col items-center justify-center gap-2 rounded-[16px] border border-dashed border-[#e7cfc5] bg-[#fffaf5] text-[#b2a8a2]"><i class="fa-solid fa-cloud-arrow-up text-2xl text-[#e79576]"></i><span class="text-[13px]">添加一张照片</span></div><div class="rounded-[13px] border border-[#eee4df] bg-[#fffaf5] px-4 py-4 text-[13px] text-[#b2a8a2]">写下此刻想说的话...</div></section>
      <button id="save-record" type="button" class="flex h-14 items-center justify-center gap-2 rounded-[15px] bg-[#e79576] text-[16px] font-semibold text-white shadow-[0_10px_24px_rgba(231,149,118,0.28)]"><i class="fa-solid fa-check"></i><span>保存记录</span></button>
    </section>
    <div id="save-toast" class="toast toast-hidden fixed bottom-7 left-5 right-5 flex items-center justify-center gap-2 rounded-[14px] bg-[#403b39] px-4 py-3 text-[14px] text-white shadow-[0_8px_24px_rgba(0,0,0,0.16)]"><i class="fa-solid fa-circle-check text-[#9ed4a5]"></i><span>记录已保存到今天</span></div>
  </main>
  <script id="interaction-data">
`
[
 {"original":"#back-button","trigger":"click","actions":[{"operation":"back"}]},
 {"original":"#date-button","trigger":"click","actions":[{"operation":"show","target":"#save-toast"},{"operation":"hide","target":"#save-toast","delayTime":1.5}]},
 {"original":"#tab-feed","trigger":"click","actions":[{"operation":"show","target":"#feed-panel"},{"operation":"hide","target":"#sleep-panel,#growth-panel,#moment-panel"},{"operation":"addClass","target":"#tab-feed","params":"main-active","operationTitle":"切换喂养"},{"operation":"removeClass","target":"#tab-sleep,#tab-growth,#tab-moment","params":"main-active","operationTitle":"更新类型"}]},
 {"original":"#tab-sleep","trigger":"click","actions":[{"operation":"hide","target":"#feed-panel,#growth-panel,#moment-panel"},{"operation":"show","target":"#sleep-panel"},{"operation":"addClass","target":"#tab-sleep","params":"main-active","operationTitle":"切换睡眠"},{"operation":"removeClass","target":"#tab-feed,#tab-growth,#tab-moment","params":"main-active","operationTitle":"更新类型"}]},
 {"original":"#tab-growth","trigger":"click","actions":[{"operation":"hide","target":"#feed-panel,#sleep-panel,#moment-panel"},{"operation":"show","target":"#growth-panel"},{"operation":"addClass","target":"#tab-growth","params":"main-active","operationTitle":"切换成长"},{"operation":"removeClass","target":"#tab-feed,#tab-sleep,#tab-moment","params":"main-active","operationTitle":"更新类型"}]},
 {"original":"#tab-moment","trigger":"click","actions":[{"operation":"hide","target":"#feed-panel,#sleep-panel,#growth-panel"},{"operation":"show","target":"#moment-panel"},{"operation":"addClass","target":"#tab-moment","params":"main-active","operationTitle":"切换瞬间"},{"operation":"removeClass","target":"#tab-feed,#tab-sleep,#tab-growth","params":"main-active","operationTitle":"更新类型"}]},
 {"original":"#feed-breast","trigger":"click","actions":[{"operation":"show","target":"#breast-panel,#feed-method-breast"},{"operation":"hide","target":"#formula-panel,#solid-panel,#feed-method-placeholder,#feed-method-formula,#feed-method-solid"},{"operation":"addClass","target":"#feed-breast","params":"choice-active","operationTitle":"选择母乳"},{"operation":"removeClass","target":"#feed-formula,#feed-solid","params":"choice-active","operationTitle":"更新喂养"}]},

 {"original":"#breast-left","trigger":"click","actions":[{"operation":"addClass","target":"#breast-left","params":"choice-active","operationTitle":"选择左侧"},{"operation":"removeClass","target":"#breast-right","params":"choice-active","operationTitle":"更新侧别"}]},
 {"original":"#breast-right","trigger":"click","actions":[{"operation":"addClass","target":"#breast-right","params":"choice-active","operationTitle":"选择右侧"},{"operation":"removeClass","target":"#breast-left","params":"choice-active","operationTitle":"更新侧别"}]},
 {"original":"#solid-rice","trigger":"click","actions":[{"operation":"show","target":"#rice-detail"},{"operation":"hide","target":"#veg-detail,#meat-detail"},{"operation":"addClass","target":"#solid-rice","params":"choice-active","operationTitle":"选择米糊"},{"operation":"removeClass","target":"#solid-veg,#solid-meat","params":"choice-active","operationTitle":"更新辅食"}]},
 {"original":"#solid-veg","trigger":"click","actions":[{"operation":"hide","target":"#rice-detail,#meat-detail"},{"operation":"show","target":"#veg-detail"},{"operation":"addClass","target":"#solid-veg","params":"choice-active","operationTitle":"选择菜泥"},{"operation":"removeClass","target":"#solid-rice,#solid-meat","params":"choice-active","operationTitle":"更新辅食"}]},
 {"original":"#solid-meat","trigger":"click","actions":[{"operation":"hide","target":"#rice-detail,#veg-detail"},{"operation":"show","target":"#meat-detail"},{"operation":"addClass","target":"#solid-meat","params":"choice-active","operationTitle":"选择肉泥"},{"operation":"removeClass","target":"#solid-rice,#solid-veg","params":"choice-active","operationTitle":"更新辅食"}]},

]

  </script>
</body>
</html>
