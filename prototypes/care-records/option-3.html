<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>概览与分类专页 · 照护记录原型</title><style>
:root{--paper:#f7f5ec;--ink:#34463b;--muted:#778279;--leaf:#7fa68a;--deep:#496f56;--line:#e8e9df;--white:#fff;--blue:#eaf1f3;--yellow:#faf0d7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,a:focus-visible{outline:3px solid #aec9b5;outline-offset:3px}a{color:var(--deep)}.shell{max-width:460px;margin:auto;min-height:100dvh;background:var(--paper);padding-bottom:110px}.demo{padding:10px 20px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.nav{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:var(--paper);z-index:3}.nav strong{font-size:17px}.nav button{min-height:44px;min-width:48px;padding:0;text-align:left}.nav .nav-end{text-align:right;color:var(--deep)}main{padding:8px 22px}h1{font-size:27px;line-height:1.3;letter-spacing:-.5px;margin:12px 0 6px}h2{font-size:18px;margin:24px 0 12px}h3{font-size:16px;margin:0}.muted{color:var(--muted);font-size:13px}.eyebrow{color:var(--deep);font-size:12px;letter-spacing:1px}.range{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:15px 16px;background:#fff;border-radius:15px;margin:22px 0 10px}.range strong{display:block;font-size:16px}.presets,.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;padding:7px 12px;min-height:38px;border-radius:20px;background:#edece3;color:var(--muted);font-size:13px}.chip.active{background:var(--deep);color:white}.tabs{margin:22px 0 16px;border-bottom:1px solid var(--line);gap:18px}.tab{padding:8px 0 12px;min-height:44px;white-space:nowrap;color:var(--muted);font-size:15px}.tab.active{color:var(--deep);box-shadow:inset 0 -3px var(--leaf);font-weight:650}.summary{display:flex;gap:18px;padding:18px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.metric{flex:1;min-width:82px}.metric strong{display:block;font-size:24px;letter-spacing:-.5px;line-height:1.4}.metric small{font-size:12px;color:var(--muted)}.group-heading{display:flex;justify-content:space-between;align-items:center;margin-top:25px;margin-bottom:10px}.group-heading strong{font-size:15px}.list{background:var(--white);border-radius:19px;padding:0 16px}.row{width:100%;padding:18px 0;text-align:left;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #f0f0e9}.row:last-child{border:0}.time{font-size:13px;color:var(--muted);padding-top:3px;min-width:39px}.row-body{flex:1;min-width:0}.row-title{font-size:15px;font-weight:650}.row-meta{font-size:12px;color:var(--muted);margin-top:5px}.row-value{display:block;font-size:20px;font-weight:650;margin:2px 0}.tag{display:inline-block;font-size:10px;font-weight:400;padding:2px 7px;border-radius:8px;background:#edf3ed;color:var(--deep);margin-left:6px}.chevron{font-size:20px;color:var(--leaf);margin-top:3px}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:16px 22px max(20px,env(safe-area-inset-bottom));background:var(--paper);z-index:4;border-top:1px solid var(--line)}.primary{border-radius:14px;background:var(--leaf);color:white;padding:13px 20px;font-weight:650;width:100%;min-height:50px}.secondary{border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-height:44px}.detail-hero{padding:12px 0 25px}.detail-hero .big{font-size:42px;font-weight:650;letter-spacing:-1px;margin:12px 0 0}.detail-card{padding:6px 18px;border-radius:18px;background:#fff;margin:15px 0}.field{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}.field:last-child{border:0}.field span:first-child{color:var(--muted);flex-shrink:0}.field span:last-child{text-align:right;overflow-wrap:anywhere}.note{padding:18px;background:#fff;border-radius:16px}.empty{padding:55px 10px;text-align:center}.empty strong{display:block;font-size:18px;margin-bottom:10px}.empty button{margin-top:20px}.log-entry{border-bottom:1px solid var(--line)}.log-entry:last-child{border:0}.log-entry summary{list-style:none;cursor:pointer;display:flex;gap:12px;padding:18px 0}.log-entry summary::-webkit-details-marker{display:none}.log-entry summary .toggle::after{content:'展开';font-size:12px;color:var(--deep)}.log-entry[open] summary .toggle::after{content:'收起'}.expanded{margin:0 0 17px 51px;padding-top:3px;font-size:13px}.expanded .field{padding:9px 0}.expanded p{margin:12px 0 0}.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.category-card{padding:18px;text-align:left;background:#fff;border-radius:18px;min-height:132px}.category-card:nth-child(2){background:var(--blue)}.category-card:nth-child(3){background:var(--yellow)}.category-card h3{margin-bottom:9px}.category-card strong{font-size:24px;display:block}.day-card{border-top:1px solid var(--line);padding:15px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.day-card button{min-height:44px;color:var(--deep);white-space:nowrap;font-size:13px}.backline{display:flex;align-items:center;gap:8px;margin:12px 0}.backline button{min-height:40px;color:var(--deep);padding:0}.subtypes{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}dialog{padding:0;border:0;border-radius:24px;max-width:420px;width:calc(100% - 32px);color:var(--ink);background:var(--paper);max-height:90dvh;overflow:auto}dialog::backdrop{background:#243a2a66}.modal{padding:24px}.modal h2{margin:0 0 16px}.modal label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #dddfd3;border-radius:10px;background:#fff;color:var(--ink);min-height:46px}textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;gap:10px;margin-top:24px}.modal-actions>*{flex:1}.error{color:#a54635;font-size:13px;margin-top:12px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);padding:10px 18px;background:var(--ink);color:#fff;border-radius:12px;z-index:8;font-size:13px}.hint{font-size:12px;color:var(--muted);margin:12px 0}.subsection{margin:20px 0 12px}.count{font-size:12px;color:var(--muted)}.demo-links{display:flex;gap:8px}.tiny{font-size:11px}@media(min-width:700px){body{padding:28px 0}.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}.dock{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style></head><body><div class="shell"><div class="demo"><span>交互原型 · 方案 3 · 演示日期 10.20</span><a href="index.html">切换方案</a></div><nav class="nav"><button class="nav-back" onclick="back()" aria-label="返回">方案</button><strong class="nav-title"></strong><button class="nav-end" onclick="navEnd()">入口</button></nav><main></main><div class="dock"><button class="primary" onclick="openAdd()">＋ <span class="add-label"></span></button></div></div>
<dialog id="date-dialog" aria-labelledby="date-title"><div class="modal"><h2 id="date-title">选择日期范围</h2><p class="muted">查看一段时间内的照护记录</p><label for="range-start">开始日期</label><input id="range-start" type="date" max="2026-10-20"><label for="range-end">结束日期</label><input id="range-end" type="date" max="2026-10-20"><p id="date-error" class="error" role="alert"></p><div class="modal-actions"><button class="secondary" onclick="document.querySelector('#date-dialog').close()">取消</button><button class="primary" onclick="applyDates()">确认范围</button></div></div></dialog>
<dialog id="entry-dialog" aria-labelledby="entry-title"><div class="modal"><h2 id="entry-title">模拟首页入口</h2><p class="muted">体验从今日照护不同位置进入的状态</p><div class="subtypes"><button class="secondary" onclick="entry('all')">查看全部</button><button class="secondary" onclick="entry('feeding')">喂养卡片</button><button class="secondary" onclick="entry('sleep')">睡眠卡片</button><button class="secondary" onclick="entry('diaper')">排便卡片</button></div><button class="secondary" onclick="document.querySelector('#entry-dialog').close()">关闭</button></div></dialog>
<dialog id="add-dialog" aria-labelledby="add-title"><div class="modal"><h2 id="add-title">添加照护记录</h2><p class="muted">仅保存在当前页面内存中，刷新后恢复示例数据。</p><label for="add-category">记录类别</label><select id="add-category" onchange="updateAddFields()"><option value="feeding">喂养</option><option value="sleep">睡眠</option><option value="diaper">排便</option><option value="health">健康 · 体温</option></select><label for="add-date">记录日期</label><input id="add-date" type="date" max="2026-10-20"><label for="add-time">记录时间</label><input id="add-time" type="time"><div id="add-fields"></div><label for="add-note">补充备注（选填）</label><textarea id="add-note" placeholder="记录一点照顾中的小细节"></textarea><p class="error" id="add-error" role="alert"></p><div class="modal-actions"><button class="secondary" onclick="document.querySelector('#add-dialog').close()">取消</button><button class="primary" onclick="saveRecord()">保存演示记录</button></div></div></dialog><script>
const MODE = 3;
const TODAY='2026-10-20';
const labels={all:'全部',feeding:'喂养',sleep:'睡眠',diaper:'排便',health:'健康'};
const sublabels={breast:'母乳',formula:'配方奶',solid:'辅食'};
const initial=[
{id:'a',date:TODAY,time:'14:37',category:'feeding',subtype:'solid',amount:120,unit:'g',author:'爸爸',food:'南瓜米糊',note:'第一次尝试南瓜，接受得很好。'},
{id:'b',date:TODAY,time:'14:36',category:'feeding',subtype:'formula',amount:120,unit:'ml',author:'妈妈',brand:'飞鹤',note:'喝完后拍嗝，无明显吐奶。'},
{id:'c',date:TODAY,time:'13:10',category:'sleep',amount:85,unit:'分钟',author:'奶奶',start:'13:10',end:'14:35',note:'午睡中途醒了一次，轻拍后继续睡。'},
{id:'d',date:TODAY,time:'10:20',category:'diaper',author:'妈妈',status:'黄色 · 软糊状',note:''},
{id:'e',date:TODAY,time:'08:25',category:'feeding',subtype:'breast',amount:15,unit:'分钟',author:'妈妈',side:'左侧',note:''},
{id:'f',date:TODAY,time:'07:10',category:'health',author:'爸爸',amount:36.7,unit:'℃',status:'体温记录',note:'精神状态良好。'},
{id:'g',date:'2026-10-19',time:'18:30',category:'feeding',subtype:'formula',amount:150,unit:'ml',author:'爸爸',brand:'飞鹤',note:''},
{id:'h',date:'2026-10-19',time:'13:00',category:'sleep',amount:100,unit:'分钟',author:'奶奶',start:'13:00',end:'14:40',note:''},
{id:'i',date:'2026-10-19',time:'09:05',category:'diaper',author:'爸爸',status:'黄色 · 成形',note:''},
{id:'j',date:'2026-10-18',time:'12:10',category:'feeding',subtype:'solid',amount:90,unit:'g',author:'妈妈',food:'胡萝卜泥',note:'吃了大半碗。'},
{id:'k',date:'2026-10-17',time:'15:20',category:'sleep',amount:70,unit:'分钟',author:'爸爸',start:'15:20',end:'16:30',note:''},
{id:'l',date:'2026-10-16',time:'10:10',category:'diaper',author:'奶奶',status:'黄色 · 软糊状',note:''},
{id:'m',date:'2026-10-15',time:'08:20',category:'feeding',subtype:'formula',amount:120,unit:'ml',author:'妈妈',note:''},
{id:'n',date:'2026-10-14',time:'09:00',category:'health',amount:36.6,unit:'℃',author:'爸爸',status:'体温记录',note:''}];
let records=initial.map(r=>({...r}));
const state={start:TODAY,end:TODAY,category:'all',subtype:'all',view:MODE===3?'overview':'list',detail:null,day:null,expanded:null,scroll:0,returnView:'list'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const rangeRecords=()=>records.filter(r=>r.date>=state.start&&r.date<=state.end);
function visibleRecords(){return rangeRecords().filter(r=>(state.category==='all'||r.category===state.category)&&(state.subtype==='all'||r.subtype===state.subtype)&&(!state.day||r.date===state.day)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}
const duration=n=>`${Math.floor(n/60)?Math.floor(n/60)+'小时':''}${n%60?n%60+'分':''}`||'0分钟';
const total=(rs,cat)=>rs.filter(r=>r.category===cat).length;
const amount=(rs,type)=>rs.filter(r=>r.subtype===type).reduce((a,r)=>a+Number(r.amount||0),0);
function titleOf(r){return r.category==='feeding'?sublabels[r.subtype]:r.category==='health'?'体温记录':labels[r.category]}
function valueOf(r){return r.category==='sleep'?duration(r.amount):r.category==='diaper'?r.status:esc(r.amount)+' '+esc(r.unit)}
function fields(r){let f=[['记录时间',r.date+' '+r.time],['记录人',r.author]];if(r.category==='feeding'){f.push(['喂养方式',sublabels[r.subtype]]);if(r.brand)f.push(['奶粉品牌',r.brand]);if(r.food)f.push(['辅食内容',r.food]);if(r.side)f.push(['哺乳侧别',r.side])}if(r.category==='sleep')f.push(['入睡时间',r.start],['醒来时间',r.end]);if(r.category==='diaper')f.push(['排便状态',r.status]);return f.map(([k,v])=>`<div class="field"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
function metrics(rs,cat){let items;if(cat==='feeding')items=[[total(rs,'feeding'),'喂养次数'],[amount(rs,'formula')+' ml','已记录配方奶量'],[rs.filter(r=>r.subtype==='solid').length,'辅食次数']];else if(cat==='sleep')items=[[total(rs,'sleep'),'睡眠段数'],[duration(rs.filter(r=>r.category==='sleep').reduce((n,r)=>n+r.amount,0)),'记录累计时长']];else if(cat==='diaper')items=[[total(rs,'diaper'),'排便次数']];else if(cat==='health')items=[[total(rs,'health'),'健康记录']];else items=[[rs.length,'照护记录'],[total(rs,'feeding'),'喂养次数'],[duration(rs.filter(r=>r.category==='sleep').reduce((n,r)=>n+r.amount,0)),'记录累计睡眠']];return `<div class="summary">${items.map(([v,l])=>`<div class="metric"><strong>${esc(v)}</strong><small>${l}</small></div>`).join('')}</div>`}
function dateControls(){const text=state.start===state.end?state.end.replaceAll('-','.'):`${state.start.slice(5).replace('-','.')} — ${state.end.slice(5).replace('-','.')}`;return `<button class="range" onclick="openDates()"><span><span class="muted">查询日期范围</span><strong>${text}${state.end===TODAY&&state.start===TODAY?' · 今天':''}</strong></span><span class="muted">选择日期</span></button><div class="presets">${[[1,'今天'],[7,'近7天'],[30,'近30天']].map(([n,l])=>`<button class="chip ${state.end===TODAY&&state.start===addDays(TODAY,1-n)?'active':''}" onclick="preset(${n})">${l}</button>`).join('')}<button class="chip" onclick="openDates()">自定义</button></div>`}
function categoryTabs(){return `<div class="tabs" role="tablist" aria-label="记录类别">${Object.entries(labels).map(([k,l])=>`<button class="tab ${state.category===k?'active':''}" role="tab" aria-selected="${state.category===k}" onclick="setCategory('${k}')">${l}</button>`).join('')}</div>`}
function subtypes(){return state.category==='feeding'?`<div class="subtypes">${Object.entries({all:'全部喂养',...sublabels}).map(([k,l])=>`<button class="chip ${state.subtype===k?'active':''}" onclick="setSubtype('${k}')">${l}</button>`).join('')}</div>`:''}
function recordRow(r){if(MODE===2)return `<details class="log-entry" data-id="${r.id}" ${state.expanded===r.id?'open':''} ontoggle="rememberExpanded(this)"><summary><span class="time">${r.time}</span><span class="row-body"><span class="row-title">${titleOf(r)}</span><span class="row-value">${valueOf(r)}</span><span class="row-meta">${esc(r.food||r.brand||r.status||'日常照护')} · ${esc(r.author)}记录</span></span><span class="toggle"></span></summary><div class="expanded">${fields(r)}${r.note?`<p>${esc(r.note)}</p>`:''}</div></details>`;return `<button class="row" onclick="openDetail('${r.id}')"><span class="time">${r.time}</span><span class="row-body"><span class="row-title">${titleOf(r)}${r.subtype==='solid'?'<span class="tag">喂养</span>':''}</span><span class="row-value">${valueOf(r)}</span><span class="row-meta">${esc(r.food||r.brand||r.status||'日常照护')} · ${esc(r.author)}记录</span></span><span class="chevron" aria-hidden="true">›</span></button>`}
function listContent(){const rs=visibleRecords();if(!rs.length)return `<div class="empty"><strong>这段时间还没有${state.category==='all'?'照护':labels[state.category]}记录</strong><span class="muted">试试扩大日期范围，或留下第一条记录。</span><br><button class="secondary" onclick="openAdd()">添加记录</button></div>`;const dates=[...new Set(rs.map(r=>r.date))];return dates.map(d=>`<div class="group-heading"><strong>${d.slice(5).replace('-','月')}日${d===TODAY?' · 今天':''}</strong><span class="count">${rs.filter(r=>r.date===d).length}条</span></div><div class="list">${rs.filter(r=>r.date===d).map(recordRow).join('')}</div>`).join('')}
function overview(){const rs=rangeRecords();return `<span class="eyebrow">每一份照顾，都被记得</span><h1>这段时间的小日常</h1><p class="muted">宝宝 · 家庭照护记录</p>${dateControls()}<div class="overview-grid">${['feeding','sleep','diaper','health'].map(c=>`<button class="category-card" onclick="openCategory('${c}')"><h3>${labels[c]} <span class="muted">›</span></h3><strong>${c==='sleep'?duration(rs.filter(r=>r.category===c).reduce((n,r)=>n+r.amount,0)):total(rs,c)+' 次'}</strong><span class="muted">${c==='feeding'?'奶类与辅食分别记录':c==='sleep'?'记录累计时长':c==='diaper'?'查看时间与状态':'体温与日常观察'}</span></button>`).join('')}</div><h2>按天回看</h2>${[...new Set(rs.map(r=>r.date))].sort().reverse().map(d=>{const rows=rs.filter(r=>r.date===d);return `<div class="day-card"><div><strong>${d.slice(5).replace('-','月')}日${d===TODAY?' · 今天':''}</strong><div class="muted">喂养${total(rows,'feeding')}次 · 睡眠${total(rows,'sleep')}段 · 排便${total(rows,'diaper')}次</div></div><button onclick="openDay('${d}')">当天记录 ›</button></div>`}).join('')||'<div class="empty">这段时间还没有照护记录</div>'}`}
function render(){const isDetail=state.view==='detail',isOverview=state.view==='overview';const pageTitle=isDetail?labels[state.detail.category]+'记录':MODE===2?'照护日志':isOverview?'照护概览':MODE===3?(state.day?'当天记录':labels[state.category]+'记录'):'照护记录';$('.nav-title').textContent=pageTitle;$('.nav-back').textContent=isDetail||MODE===3&&!isOverview?'返回':'方案';$('.nav-end').textContent=isDetail?'完成':'入口';let html='';if(isDetail){const r=state.detail;html=`<div class="detail-hero"><span class="eyebrow">${labels[r.category]} · ${esc(r.author)}记录</span><h1>${titleOf(r)}</h1><div class="big">${valueOf(r)}</div><div class="muted">${r.date} ${r.time}</div></div><div class="detail-card">${fields(r)}</div>${r.note?`<h2>补充备注</h2><div class="note">${esc(r.note)}</div>`:''}<p class="hint">没有备注或照片时，不显示空白区块。</p>`}else if(isOverview)html=overview();else{html=`${MODE===3?'<div class="backline"><button onclick="back()">返回照护概览</button></div>':'<span class="eyebrow">小树成长日记 · 宝宝</span><h1>'+ (MODE===2?'把照顾串成日常':'每一笔，都是用心')+'</h1>'}${dateControls()}${MODE===3?subtypes():categoryTabs()+subtypes()}${state.day?'<h2>'+state.day+' 的记录</h2>':''}${metrics(visibleRecords(),state.category)}${state.category==='feeding'?'<p class="hint">母乳按时长、配方奶按奶量、辅食按次数分别统计。</p>':''}${MODE===2?'<p class="hint">轻点记录展开内容，无需跳转页面。</p>':''}${listContent()}`};$('main').innerHTML=html;$('.dock').hidden=isDetail;$('.add-label').textContent='添加'+(state.category==='all'||isOverview?'照护记录':labels[state.category]);}
function setCategory(c){state.category=c;state.subtype='all';state.expanded=null;render()}
function setSubtype(t){state.subtype=t;render()}
function preset(n){state.start=addDays(TODAY,1-n);state.end=TODAY;state.day=null;state.expanded=null;render()}
function openDetail(id){state.scroll=window.scrollY;state.returnView=state.view;state.detail=records.find(r=>r.id===id);state.view='detail';render();window.scrollTo(0,0)}
function openCategory(c){state.category=c;state.subtype='all';state.day=null;state.view='list';render();window.scrollTo(0,0)}
function openDay(d){state.day=d;state.category='all';state.subtype='all';state.view='list';render();window.scrollTo(0,0)}
function back(){if(state.view==='detail'){state.view=state.returnView;state.detail=null;render();window.scrollTo(0,state.scroll)}else if(MODE===3&&state.view!=='overview'){state.view='overview';state.day=null;state.category='all';render();window.scrollTo(0,0)}else{window.location.href='index.html'}}
function navEnd(){if(state.view==='detail')back();else $('#entry-dialog').showModal()}
function entry(c){$('#entry-dialog').close();state.start=TODAY;state.end=TODAY;state.category=c;state.subtype='all';state.day=null;state.view=MODE===3&&c==='all'?'overview':'list';render();window.scrollTo(0,0)}
function rememberExpanded(el){if(el.open){state.expanded=el.dataset.id;document.querySelectorAll('.log-entry').forEach(other=>{if(other!==el)other.open=false})}else if(state.expanded===el.dataset.id)state.expanded=null}
function openDates(){$('#range-start').value=state.start;$('#range-end').value=state.end;$('#date-error').textContent='';$('#date-dialog').showModal()}
function applyDates(){const a=$('#range-start').value,b=$('#range-end').value;if(!a||!b||a>b||b>TODAY){$('#date-error').textContent='请选择有效起止日期，结束日期不能晚于今天。';return}state.start=a;state.end=b;state.day=null;state.expanded=null;$('#date-dialog').close();render()}
function openAdd(){const c=state.category==='all'?'feeding':state.category;$('#add-category').value=c;$('#add-date').value=state.day||state.end;$('#add-time').value='15:00';$('#add-note').value='';$('#add-error').textContent='';updateAddFields();$('#add-dialog').showModal()}
function updateAddFields(){const c=$('#add-category').value;$('#add-fields').innerHTML=c==='feeding'?`<label for="add-subtype">喂养子类型</label><select id="add-subtype" onchange="updateAmountUnit()"><option value="formula">配方奶</option><option value="breast">母乳</option><option value="solid">辅食</option></select><label id="amount-label" for="add-amount">奶量（ml）</label><input id="add-amount" type="number" min="0.1" step="0.1" value="120"><label for="add-extra">品牌 / 辅食内容 / 哺乳侧别（选填）</label><input id="add-extra">`:c==='sleep'?`<label for="add-start">入睡时间</label><input id="add-start" type="time" value="13:00"><label for="add-end">醒来时间</label><input id="add-end" type="time" value="14:00"><p class="hint">此原型新增仅演示同日睡眠，醒来时间需晚于入睡时间。</p>`:c==='diaper'?`<label for="add-status">排便状态</label><select id="add-status"><option>黄色 · 软糊状</option><option>黄色 · 成形</option><option>绿色 · 偏稀</option></select>`:`<label for="add-amount">体温（℃）</label><input id="add-amount" type="number" min="30" max="45" step="0.1" value="36.7">`}
function updateAmountUnit(){$('#amount-label').textContent={formula:'奶量（ml）',breast:'哺乳时长（分钟）',solid:'辅食份量（g）'}[$('#add-subtype').value]}
function saveRecord(){const c=$('#add-category').value,date=$('#add-date').value,time=$('#add-time').value;const r={id:'new-'+Date.now(),date,time,category:c,author:'我',note:$('#add-note').value.trim()};const fail=m=>{$('#add-error').textContent=m};if(!date||date>TODAY||!time)return fail('请填写有效的记录日期和时间。');if(c==='feeding'||c==='health'){r.amount=Number($('#add-amount').value);if(!(r.amount>0))return fail('请填写大于零的数值。');if(c==='feeding'){r.subtype=$('#add-subtype').value;r.unit={formula:'ml',breast:'分钟',solid:'g'}[r.subtype];const extra=$('#add-extra').value.trim();if(extra)r[{formula:'brand',solid:'food',breast:'side'}[r.subtype]]=extra}else{if(r.amount<30||r.amount>45)return fail('体温请填写30—45℃之间的数值。');r.unit='℃';r.status='体温记录'}}if(c==='sleep'){r.start=$('#add-start').value;r.end=$('#add-end').value;if(!r.start||!r.end||r.start>=r.end)return fail('此原型请填写同日且醒来晚于入睡的时间。');const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));r.amount=mins(r.end)-mins(r.start);r.unit='分钟';r.time=r.start}if(c==='diaper')r.status=$('#add-status').value;records.push(r);$('#add-dialog').close();state.category=c;state.subtype='all';state.day=null;state.start=date;state.end=date;state.view='list';if(MODE===2)state.expanded=r.id;render();toast('已添加演示记录');}
function toast(text){const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
render();
</script></body></html>
