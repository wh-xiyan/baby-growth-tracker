<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>疫苗详情 · 小树成长日记</title>
<style>
:root{--paper:#f7f5ec;--ink:#34463b;--muted:#778279;--leaf:#7fa68a;--deep:#496f56;--line:#e6e8de;--honey:#f2e6c7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,a:focus-visible{outline:3px solid #adcab7;outline-offset:3px}a{color:var(--deep)}.app{max-width:440px;margin:auto;min-height:100dvh;padding-bottom:128px}.demo{max-width:440px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);flex-wrap:wrap}.demo select{padding:4px 6px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--paper);color:var(--deep);max-width:140px}.demo label{display:flex;align-items:center;gap:4px}.nav{display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:2;background:var(--paper);padding:0 22px}.nav strong{font-size:17px}.nav button{font-size:13px;color:var(--deep);min-height:44px;min-width:50px;padding:0;text-align:left}.nav button:last-child{text-align:right}main{padding:10px 24px 25px}.eyebrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin:13px 0}.status{padding:4px 10px;border-radius:18px;background:#e7efe6;color:var(--deep);font-size:11px}.status.overdue{background:#f8e7df;color:#995d47}.status.completed{background:#e5eef1;color:#527580}.status.skipped{background:#ecece4;color:#7b8175}h1{font-size:30px;line-height:1.4;letter-spacing:-.5px;margin:18px 0 10px;font-weight:650}h2{font-size:17px;margin:26px 0 12px;font-weight:650}.subtitle{font-size:13px;color:var(--muted)}.date-focus{margin:28px 0;padding-bottom:25px;border-bottom:1px solid var(--line)}.caption{font-size:12px;color:var(--muted)}.date-primary{font-size:35px;letter-spacing:-1px;line-height:1.4;font-weight:650;margin:7px 0}.relative{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--honey);color:#827044;font-size:12px;margin-top:6px}.data-list{padding:4px 18px;background:#fff;border-radius:18px}.field{padding:15px 0;border-bottom:1px solid #eff0e9;display:flex;gap:18px;justify-content:space-between;align-items:baseline;font-size:14px}.field:last-child{border:0}.field-label{color:var(--muted);flex-shrink:0}.field-value{text-align:right;word-break:break-word}.note{padding:18px;background:#fff;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}.text-link{width:100%;margin-top:22px;padding:13px 0;color:var(--deep);border-top:1px solid var(--line);display:flex;justify-content:space-between;text-align:left;font-size:14px;min-height:48px}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);padding:14px 22px max(20px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);z-index:3}.actions{display:flex;gap:10px}.primary,.secondary{min-height:50px;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600}.primary{background:var(--leaf);color:#fff;flex:1}.secondary{background:#eaece1;color:var(--deep)}.full{width:100%}.readonly{text-align:center;font-size:12px;color:var(--muted);margin:0 0 9px}.reminder{margin-top:10px;font-size:12px;color:var(--muted)}dialog{padding:0;border:0;border-radius:23px;background:var(--paper);color:var(--ink);width:calc(100% - 32px);max-width:420px;max-height:88dvh;overflow:auto}dialog::backdrop{background:#243a2a66}.modal{padding:24px}.modal h2{margin:0 0 8px;font-size:21px}.modal p{margin:6px 0 18px;font-size:13px;color:var(--muted)}.modal label{display:block;margin:15px 0 6px;font-size:13px;color:var(--muted)}.modal input:not([type=checkbox]),.modal select,.modal textarea{width:100%;border:1px solid #dfe1d6;border-radius:10px;padding:12px;background:#fff;color:var(--ink);min-height:46px}.modal textarea{min-height:80px;resize:vertical}.modal .actions{margin-top:24px}.error{color:#a4513e;font-size:12px;min-height:18px;margin-top:10px}.dose{padding:17px 0;width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center;border-bottom:1px solid var(--line);font-size:14px}.dose span{display:block}.dose small{color:var(--muted);font-size:12px}.dose.active{color:var(--deep);font-weight:600}.empty{text-align:center;padding:70px 10px;color:var(--muted)}.empty strong{font-size:20px;display:block;color:var(--ink);margin-bottom:12px}.empty button{margin-top:25px}.toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:12px;background:var(--ink);color:white;z-index:8;font-size:13px}.switch-label{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important}.tiny{font-size:11px!important}.dose-head{display:flex;justify-content:space-between;align-items:center}.modal-close{font-size:13px;color:var(--deep);min-height:44px}.demo-note{font-size:11px;color:var(--muted);margin-top:26px;text-align:center}@media(min-width:700px){body{padding:26px 0}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}.demo{border:1px solid var(--line);border-bottom:0}.dock{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="demo"><span>HTML交互原型 · 2026.10.20</span><label>状态<select id="demo-state" onchange="switchState(this.value)"><option value="planned">待接种</option><option value="today">今天接种</option><option value="overdue">已逾期</option><option value="completed">已接种</option><option value="skipped">已跳过</option><option value="error">加载失败</option></select></label><label><input id="viewer" type="checkbox" onchange="setViewer(this.checked)">只读成员</label></div>
<div class="app"><nav class="nav"><button onclick="openPlans()">全部计划</button><strong>疫苗详情</strong><button onclick="openAbout()">说明</button></nav><main id="content"></main><footer class="dock" id="dock"></footer></div>
<dialog id="edit-dialog" aria-labelledby="edit-title"><div class="modal"><h2 id="edit-title">调整接种计划</h2><p id="edit-subtitle"></p><label for="edit-date">计划接种日期</label><input id="edit-date" type="date"><label for="edit-institution">接种机构（选填）</label><input id="edit-institution" maxlength="80"><label for="edit-payment">费用类型</label><select id="edit-payment" onchange="paymentChanged()"><option value="free">免费</option><option value="self_paid">自费</option></select><div id="paid-field"><label for="edit-paid-note">自费说明（选填）</label><input id="edit-paid-note" maxlength="50"></div><div class="error" id="edit-error" role="alert"></div><div class="actions"><button class="secondary" onclick="closeDialog('edit-dialog')">取消</button><button class="primary" onclick="savePlan()">保存计划</button></div></div></dialog>
<dialog id="complete-dialog" aria-labelledby="complete-title"><div class="modal"><h2 id="complete-title">记录已接种</h2><p id="complete-subtitle"></p><label for="completed-date">实际接种日期</label><input id="completed-date" type="date" max="2026-10-20"><label for="completed-institution">接种机构（选填）</label><input id="completed-institution" maxlength="80"><label for="completed-note">接种备注（选填）</label><textarea id="completed-note" maxlength="500" placeholder="按实际接种情况补充记录"></textarea><div class="error" id="complete-error" role="alert"></div><div class="actions"><button class="secondary" onclick="closeDialog('complete-dialog')">取消</button><button class="primary" onclick="completeDose()">确认已接种</button></div></div></dialog>
<dialog id="plans-dialog" aria-labelledby="plans-title"><div class="modal"><div class="dose-head"><h2 id="plans-title">疫苗计划</h2><button class="modal-close" onclick="closeDialog('plans-dialog')">关闭</button></div><p>宝宝的水痘疫苗 · 共2针</p><div id="dose-list"></div><p class="tiny" style="margin-top:18px">此处仅演示同一疫苗的两针计划，可点击切换详情。</p></div></dialog>
<dialog id="about-dialog" aria-labelledby="about-title"><div class="modal"><h2 id="about-title">原型说明</h2><p>沿用小树成长日记的燕麦白与叶绿色。先突出当前剂次与接种日期，再展示机构、费用和备注。</p><p>可模拟调整计划、记录已接种、查看各针详情，以及只读和失败状态。</p><p>演示修改仅保存在页面内存，刷新恢复。提醒区仅展示当前计划配置，不代表已完成微信消息订阅或实际通知。</p><button class="primary full" onclick="closeDialog('about-dialog')">知道了</button></div></dialog>
<script>
const TODAY='2026-10-20';
const baseline={id:'dose-2',name:'水痘减毒活疫苗',doseNumber:2,totalDoses:2,plannedDate:'2026-10-28',status:'planned',institution:'滨江社区卫生服务中心',paymentType:'self_paid',selfPaidVaccineNote:'水痘疫苗 · 具体费用以接种机构为准',reminderEnabled:true,reminderDaysBefore:7,note:'预约后由爸爸陪同，带好预防接种证。'};
const first={id:'dose-1',name:baseline.name,doseNumber:1,totalDoses:2,plannedDate:'2026-04-28',completedDate:'2026-04-28',status:'completed',institution:baseline.institution,paymentType:'self_paid',reminderEnabled:false,completedNote:'已完成第1针接种。'};
let vaccine={...baseline},second={...baseline},viewer=false,error=false;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(new Date(d+'T00:00:00Z').getTime())&&new Date(d+'T00:00:00Z').toISOString().slice(0,10)===d;
const diff=d=>Math.round((new Date(d+'T00:00:00+08:00')-new Date(TODAY+'T00:00:00+08:00'))/86400000);
function statusInfo(v){if(v.status==='completed')return{label:'已接种',className:'completed'};if(v.status==='skipped')return{label:'已跳过',className:'skipped'};const n=diff(v.plannedDate);return{label:n<0?'计划已逾期':n===0?'今天接种':'待接种',className:n<0?'overdue':''}}
const field=(label,value)=>`<div class="field"><span class="field-label">${label}</span><span class="field-value">${esc(value)}</span></div>`;
function render(){if(error){$('#content').innerHTML='<div class="empty"><strong>暂时没能找到这份计划</strong><div>可能加载失败、计划已删除或暂无查看权限。</div><button class="primary full" onclick="retry()">重新加载</button></div>';$('#dock').hidden=true;return}$('#dock').hidden=false;const v=vaccine,s=statusInfo(v),done=v.status==='completed',planned=v.status==='planned',n=diff(v.plannedDate);$('#content').innerHTML=`<div class="eyebrow"><span>宝宝的健康小档案</span><span class="status ${s.className}">${s.label}</span></div><h1>${esc(v.name)}</h1><div class="subtitle">第 ${v.doseNumber} 针 / 共 ${v.totalDoses} 针 · ${v.paymentType==='self_paid'?'自费':v.paymentType==='free'?'免费':'费用未填写'}</div><section class="date-focus"><div class="caption">${done?'实际接种日期':'计划接种日期'}</div><div class="date-primary">${esc(done?v.completedDate:v.plannedDate).replaceAll('-','.')}</div>${planned?`<span class="relative">${n<0?'已超过计划日期 '+Math.abs(n)+' 天':n===0?'今天是计划接种日':'距离计划日期还有 '+n+' 天'}</span>`:done?'<span class="caption">这一次守护，已经记好。</span>':'<span class="caption">此剂次已跳过，不计入已接种。</span>'}</section><h2>接种信息</h2><div class="data-list">${field('接种机构',v.institution||'未填写')}${done?field('原计划日期',v.plannedDate):''}${field('费用类型',v.paymentType==='self_paid'?'自费':v.paymentType==='free'?'免费':'未填写')}${v.paymentType==='self_paid'&&v.selfPaidVaccineNote?field('自费说明',v.selfPaidVaccineNote):''}${planned?field('计划提醒',v.reminderEnabled?'提前 '+(v.reminderDaysBefore??7)+' 天':'未开启'):''}</div>${v.note?`<h2>计划备注</h2><div class="note">${esc(v.note)}</div>`:''}${done&&v.completedNote?`<h2>接种备注</h2><div class="note">${esc(v.completedNote)}</div>`:''}<button class="text-link" onclick="openPlans()"><span>查看全部疫苗计划</span><span aria-hidden="true">›</span></button>`;$('#dock').innerHTML=viewer?'<div class="readonly">当前为只读成员，可查看接种计划</div><button class="secondary full" onclick="openPlans()">查看全部计划</button>':planned?'<div class="actions"><button class="secondary" onclick="openEdit()">调整计划</button><button class="primary" onclick="openComplete()">记录已接种</button></div>':'<button class="primary full" onclick="openPlans()">查看全部疫苗计划</button>'}
function closeDialog(id){$('#'+id).close()}
function openAbout(){$('#about-dialog').showModal()}
function openEdit(){if(viewer||vaccine.status!=='planned')return;$('#edit-subtitle').textContent=vaccine.name+' · 第'+vaccine.doseNumber+'针';$('#edit-date').value=vaccine.plannedDate;$('#edit-institution').value=vaccine.institution||'';$('#edit-payment').value=vaccine.paymentType||'free';$('#edit-paid-note').value=vaccine.selfPaidVaccineNote||'';$('#edit-error').textContent='';paymentChanged();$('#edit-dialog').showModal()}
function paymentChanged(){$('#paid-field').hidden=$('#edit-payment').value!=='self_paid'}
function savePlan(){if(viewer||vaccine.status!=='planned')return;const date=$('#edit-date').value;if(!validDate(date)){$('#edit-error').textContent='请选择有效的计划日期。';return}if(date<first.completedDate){$('#edit-error').textContent='第2针计划日期不能早于第1针实际接种日期。';return}vaccine={...vaccine,plannedDate:date,institution:$('#edit-institution').value.trim(),paymentType:$('#edit-payment').value,selfPaidVaccineNote:$('#edit-payment').value==='self_paid'?$('#edit-paid-note').value.trim():''};second={...vaccine};closeDialog('edit-dialog');render();toast('计划已更新（演示）')}
function openComplete(){if(viewer||vaccine.status!=='planned')return;$('#complete-subtitle').textContent=vaccine.name+' · 第'+vaccine.doseNumber+'针';$('#completed-date').value=TODAY;$('#completed-institution').value=vaccine.institution||'';$('#completed-note').value='';$('#complete-error').textContent='';$('#complete-dialog').showModal()}
function completeDose(){if(viewer||vaccine.status!=='planned')return;const date=$('#completed-date').value;if(!validDate(date)||date>TODAY){$('#complete-error').textContent='实际接种日期需有效且不晚于今天。';return}if(date<first.completedDate){$('#complete-error').textContent='实际接种日期不能早于第1针实际接种日期。';return}vaccine={...vaccine,status:'completed',completedDate:date,institution:$('#completed-institution').value.trim(),completedNote:$('#completed-note').value.trim()};second={...vaccine};closeDialog('complete-dialog');$('#demo-state').value='completed';render();toast('已记下这次接种（演示）')}
function openPlans(){const list=[first,second];$('#dose-list').innerHTML=list.map(v=>`<button class="dose ${v.id===vaccine.id?'active':''}" onclick="selectDose('${v.id}')"><span>第 ${v.doseNumber} 针${v.id===vaccine.id?' · 当前查看':''}<small>${esc(v.status==='completed'?v.completedDate:v.plannedDate)} · ${statusInfo(v).label}</small></span><span>›</span></button>`).join('');$('#plans-dialog').showModal()}
function selectDose(id){vaccine={...(id==='dose-1'?first:second)};error=false;$('#demo-state').value=vaccine.status==='planned'?(diff(vaccine.plannedDate)<0?'overdue':diff(vaccine.plannedDate)===0?'today':'planned'):vaccine.status;closeDialog('plans-dialog');render();window.scrollTo(0,0)}
function setViewer(value){viewer=value;render()}
function switchState(value){vaccine={...baseline};error=value==='error';if(value==='today')vaccine.plannedDate=TODAY;if(value==='overdue')vaccine.plannedDate='2026-10-17';if(value==='completed')vaccine={...baseline,status:'completed',completedDate:'2026-10-19',completedNote:'爸爸陪同完成接种，信息已核对。'};if(value==='skipped')vaccine={...baseline,status:'skipped',note:'本剂次计划已跳过，后续安排另行记录。'};second={...vaccine};render()}
function retry(){error=false;vaccine={...second};$('#demo-state').value=vaccine.status;render()}
function toast(text){const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
render();
</script>
</body></html>
