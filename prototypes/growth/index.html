<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成长档案中心 · 方案一</title><link rel="stylesheet" href="base.css"><style>.growth-title{margin-bottom:20px}.chart{width:100%;height:185px;display:block;background:#fff;border-radius:15px}.chart-values{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.latest{font-size:38px;font-weight:650;line-height:1.4;margin-top:10px}.stat-note{font-size:12px;color:var(--muted);margin-bottom:20px}.record-heading{margin:22px 0 10px;font-weight:600}.permission{background:#eaf1ea;border-radius:12px;padding:12px;margin:16px 0;font-size:12px;color:var(--deep)}.controls{display:flex;gap:8px;flex-wrap:wrap}.demo select{font-size:12px;max-width:145px;padding:2px}.method{font-size:11px;color:var(--deep);background:#eaf1ea;padding:2px 7px;border-radius:7px}.sheet-note{font-size:12px;color:var(--muted)}.chart-box{position:relative}.point-info{font-size:13px;background:#eaf1ea;border-radius:10px;padding:12px;margin-top:10px}.body-copy{white-space:pre-wrap}.danger{color:#a24f3d}.range-inputs{display:flex;gap:10px}.range-inputs label{flex:1;min-width:0}.range-inputs input{font-size:13px;padding:8px}.row-meta{display:block}.nav{position:static}.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.media-tile{position:relative;min-width:0}.media-thumb{padding:0;width:100%;height:96px;border-radius:12px;overflow:hidden;background:#eaece3;display:block}.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;display:block}.media-remove{position:absolute;top:4px;right:4px;padding:3px 6px;background:#34463be6;color:white;border-radius:6px;font-size:11px;min-height:28px}.media-type{position:absolute;bottom:5px;left:5px;background:#34463bd9;color:#fff;border-radius:5px;font-size:10px;padding:2px 5px;pointer-events:none}.media-filename{font-size:10px;color:var(--muted);white-spa ize:22px}.ref-insight .count{display:block;font-weight:400}.ref-position{font-size:19px;color:var(--deep);margin:14px 0 6px}.ref-values{display:flex;gap:14px;border-block:1px solid var(--line);padding:12px 0;font-size:12px;color:var(--muted)}.ref-values span{flex:1}.ref-values strong{display:block;color:var(--ink);font-size:15px}.ref-alert{background:#faf0d7;border-radius:10px;padding:12px;font-size:13px}.point-pills{display:flex;gap:8px;overflow:auto;padding:8px 0}.point-pills .chip{flex-shrink:0}#reference-dialog p{font-size:13px}#reference-dialog h3{margin-top:22px}</style></head><body>
<div class="shell"><div class="demo"><span>成长档案 · 可点击原型</span><select aria-label="模拟角色" id="role" onchange="render()"><option value="owner">管理员</option><option value="adult">普通成员（妈妈）</option><option value="viewer">只读成员</option></select></div><nav class="nav"><button onclick="goBack()" id="back">首页</button><strong id="nav-title">成长</strong><button class="nav-end" onclick="switchBaby()" id="baby-button">切换宝宝</button></nav><main id="app"></main><div class="dock" id="dock"></div></div>
<dialog id="form-dialog"><div class="modal"><h2 id="form-title"></h2><p class="sheet-note">仅演示当前页面内存保存，刷新恢复。发生时间不能晚于现在。</p><form id="record-form" onsubmit="save(event)"><label for="kind">记录类型</label><select id="kind" onchange="formFields()"><option value="measurement">身体测量</option><option value="milestone">里程碑</option><option value="study">学习变化</option></select><label for="when">发生时间</label><input id="when" type="datetime-local" required><div id="fields"></div><label for="description">补充描述（选填）</label><textarea id="description" maxlength="2000"></textarea><section id="media-section" hidden><div class="media-header"><label>照片与视频（选填）</label><span id="media-count" class="media-count">0 / 10</span></div><p class="sheet-note">照片与视频合计最多10个，可混合选择。点击缩略图预览，移除后可继续添加。</p><input id="media-input" type="file" accept="image/*,video/*" multiple hidden onchange="chooseMedia(this)"><div id="media-draft" class="media-grid"></div><button id="media-add" class="media-picker" type="button" onclick="document.querySelector('#media-input').click()">添加照片 / 视频</button><p id="media-warning" class="media-warning" role="status"></p><p class="sheet-note">此原型只在本机预览文件，不上传云端，刷新后清空。</p></section><p class="error" id="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="secondary" onclick="closeForm()">取消</button><button type="submit" class="primary">保存记录</button></div></form></div></dialog>
<dialog id="range-dialog"><div class="modal"><h2>自定义日期范围</h2><label for="from">开始日期</label><input type="date" id="from"><label for="to">结束日期</label><input type="date" id="to"><p class="error" id="range-error"></p><div class="modal-actions"><button class="secondary" onclick="document.querySelector('#range-dialog').close()">取消</button><button class="primary" onclick="applyRange()">确认</button></div></div></dialog>
<dialog id="media-preview" aria-labelledby="preview-title"><div class="modal"><div class="preview-bar"><strong id="preview-title">媒体预览</strong><button type="button" onclick="closeMediaPreview()">关闭</button></div><div id="preview-body"></div><div class="preview-bar"><button id="preview-prev" type="button" onclick="movePreview(-1)">上一项</button><span id="preview-position" class="muted"></span><button id="preview-next" type="button" onclick="movePreview(1)">下一项</button></div><div id="preview-name" class="muted"></div></div></dialog><script src="reference-data.js"></script><script src="reference-ui.js"></script><script>
let draftMedia=[],previewMedia=[],previewIndex=0,mediaCounter=0;
const NOW=new Date(),TODAY=localDay(NOW);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDay(d){return new Date(d.getTime()+8*3600000).toISOString().slice(0,10)}
const daysAgo=n=>new Date(new Date(TODAY+'T12:00:00Z').getTime()-n*86400000).toISOString().slice(0,10);
const babies=[{id:'a',name:'小禾',birthday:'2025-03-12'},{id:'b',name:'小满',birthday:'2026-01-25'}];
let baby=0,tab='measurement',metric='height',view='main',type='all',range='year',from='',to=TODAY,selected=null,editing=null,point=null,returnView='main';
const metricLabels={height:'身长/身高',weight:'体重',headCircumference:'头围'},units={height:'cm',weight:'kg',headCircumference:'cm'},methods={lying:'卧位身长',standing:'站立身高',unknown:'未记录方法'};
let records=[...Array.from({length:5},(_,i)=>({id:'m'+i,baby:'a',kind:'measurement',when:daysAgo([170,115,60,20,0][i])+'T09:00',height:[73,75.5,77,79,80.2][i],weight:[9.1,9.4,9.8,10.1,10.3][i],headCircumference:[45,45.5,46,46.2,46.5][i],method:i===3?'standing':'lying',source:i===4?'机构测量':'家庭测量',author:i%2?'爸爸':'妈妈',description:i===4?'社区体检记录，已核对测量数据。':''})),{id:'e1',baby:'a',kind:'milestone',when:daysAgo(3)+'T10:30',title:'第一次自己穿上鞋子',description:'试了几次，终于成功啦。',author:'爸爸'},{id:'e2',baby:'a',kind:'study',when:daysAgo(8)+'T16:00',title:'认识了三种颜色',description:'能找到红色、黄色和绿色的积木。',author:'妈妈'}];
const current=()=>records.filter(r=>r.baby===babies[baby].id).sort((a,b)=>b.when.localeCompare(a.when));
const canAdd=()=>$('#role').value!=='viewer';const canEdit=r=>$('#role').value==='owner'||($('#role').value==='adult'&&r.author==='妈妈');
function age(date){const b=new Date(babies[baby].birthday+'T00:00:00+08:00'),d=new Date(date+'T00:00:00+08:00');let m=(d.getFullYear()-b.getFullYear())*12+d.getMonth()-b.getMonth();if(d.getDate()<b.getDate())m--;return m<12?Math.max(m,0)+'个月':Math.floor(m/12)+'岁'+m%12+'个月'}
function within(r){const d=r.when.slice(0,10);return d<=to&&(!from||d>=from)}
function presets(){return `<button class="range" onclick="openRange()"><span><small class="muted">查询日期范围</small><strong>${from?from+' — '+to:'全部历史'}</strong></span><span>选择日期 ›</span></button><div class="presets">${[['quarter','近3个月',90],['half','近6个月',180],['year','近1年',365],['all','全部',null]].map(([k,l,n])=>`<button class="chip ${range===k?'active':''}" onclick="setRange('${k}',${n})">${l}</button>`).join('')}</div>`}
function setRange(k,n){range=k;from=n?daysAgo(n-1):'';to=TODAY;point=null;render()}
function row(r){return `<button class="row" onclick="detail('${r.id}')"><span class="time">${r.when.slice(5,10).replace('-','/')}</span><span class="row-body"><span class="row-title">${r.kind==='measurement'?Object.keys(metricLabels).filter(k=>r[k]!=null).map(k=>metricLabels[k]+' '+r[k]+units[k]).join(' · '):esc(r.title)}</span>${(r.media||[]).length?`<span class="row-meta">${r.media.length}个附件 · ${r.media.filter(m=>m.type==='image').length}张照片 / ${r.media.filter(m=>m.type==='video').length}个视频</span>${r.media[0].type==='image'?`<img class="event-media-cover" src="${esc(r.media[0].url)}" alt="${esc(r.media[0].name)}" onerror="this.hidden=true">`:''}`:''}<span class="row-meta">${r.kind==='measurement'?methods[r.method]||methods.unknown:(r.kind==='milestone'?'里程碑':'学习变化')} · ${age(r.when.slice(0,10))} · ${esc(r.author)}记录</span></span><span class="chevron">›</span></button>`}
function render(){const list=current();$('#baby-button').hidden=view==='detail';$('#back').textContent=view==='main'?'首页':'返回';$('#nav-title').textContent=view==='detail'?'成长记录':view==='history'?'测量历史':'成长';let html='';if(view==='detail'){const r=list.find(r=>r.id===selected);if(!r){view='main';render();return}html=`<span class="eyebrow">${r.kind==='measurement'?'身体测量':r.kind==='milestone'?'里程碑':'学习变化'} · ${esc(r.author)}记录</span><h1>${r.kind==='measurement'?'身体测量':esc(r.title)}</h1><p class="muted">${r.when.replace('T',' ')} · 当时${age(r.when.slice(0,10))}</p>${r.kind==='measurement'?`<div class="detail-card">${Object.keys(metricLabels).filter(k=>r[k]!=null).map(k=>field(metricLabels[k],r[k]+' '+units[k])).join('')}${field('身高测量方法',methods[r.method]||methods.unknown)}${field('测量来源',r.source||'未记录')}</div>`:''}${(r.media||[]).length?`<h2>照片与视频 <span class="count">${r.media.length}个</span></h2><div class="media-grid">${r.media.map((m,i)=>mediaTile(m,i,false)).join('')}</div>`:''}${r.description?`<h2>补充描述</h2><div class="note body-copy">${esc(r.description)}</div>`:''}<div class="permission">${canEdit(r)?'你可以编辑或删除这条记录。':canAdd()?'这是其他成员的记录，仅管理员可以修改。':'当前为只读成员，可查看成长记录。'}</div>`;$('#dock').innerHTML=canEdit(r)?`<div class="modal-actions" style="margin:0"><button class="secondary danger" onclick="removeRecord()">删除</button><button class="primary" onclick="openForm('${r.kind}','${r.id}')">编辑记录</button></div>`:`<button class="secondary full" style="width:100%" onclick="goBack()">返回列表</button>`}else{html=`<span class="eyebrow">小树成长日记</span><h1>${babies[baby].name}的成长档案</h1><p class="muted">${age(TODAY)} · 看见变化，珍藏每一个第一次</p>${view==='main'?`<div class="tabs"><button class="tab ${tab==='measurement'?'active':''}" onclick="setTab('measurement')">身体测量</button><button class="tab ${tab==='events'?'active':''}" onclick="setTab('events')">成长事件</button></div>`:''}`;if(tab==='measurement'||view==='history'){const all=list.filter(r=>r.kind==='measurement'&&r[metric]!=null),rs=all.filter(within),latest=all[0],previous=all[1];html+=`<div class="subtypes">${Object.entries(metricLabels).map(([k,l])=>`<button class="chip ${metric===k?'active':''}" onclick="metric='${k}';point=null;render()">${l}</button>`).join('')}</div>`;if(view==='main')html+=`<span class="muted">全历史最新${metricLabels[metric]}</span><div class="latest">${latest?latest[metric]+' '+units[metric]:'尚未记录'}</div><div class="stat-note">${latest?latest.when.slice(0,10)+' 测量':''}${previous?' · 较上次 '+(latest[metric]-previous[metric]>=0?'+':'')+(latest[metric]-previous[metric]).toFixed(1)+units[metric]+'（'+previous.when.slice(0,10)+'）':''}</div>`;html+=presets();if(view==='main'){html+=growthChart(rs)}else{const months=[...new Set(rs.map(r=>r.when.slice(0,7)))];html+=months.map((m,i)=>`<details ${i===0?'open':''}><summary class="record-heading">${m.replace('-','年')}月 · ${rs.filter(r=>r.when.startsWith(m)).length}条</summary><div class="list">${rs.filter(r=>r.when.startsWith(m)).map(row).join('')}</div></details>`).join('')||'<div class="empty">没有符合条件的测量</div>'}}else{html+=presets()+`<div class="subtypes">${[['all','全部'],['milestone','里程碑'],['study','学习']].map(([k,l])=>`<button class="chip ${type===k?'active':''}" onclick="type='${k}';render()">${l}</button>`).join('')}</div>`;const rs=list.filter(r=>r.kind!=='measurement'&&(type==='all'||r.kind===type)&&within(r));const dates=[...new Set(rs.map(r=>r.when.slice(0,10)))];html+=dates.map((d,i)=>`<details ${i===0?'open':''}><summary class="record-heading">${d} · ${rs.filter(r=>r.when.startsWith(d)).length}条</summary><div class="list">${rs.filter(r=>r.when.startsWith(d)).map(row).join('')}</div></details>`).join('')||'<div class="empty"><strong>还没有这类成长记录</strong>留下一个新发现，让故事从这里开始。</div>'}$('#dock').innerHTML=canAdd()?`<button class="primary" onclick="openForm('${tab==='measurement'||view==='history'?'measurement':type==='study'?'study':'milestone'}')">＋ ${tab==='measurement'||view==='history'?'记录测量':'记录成长事件'}</button>`:'<div class="readonly">只读成员可以回看档案，不能新增或修改。</div>'}$('#app').innerHTML=html;if(view==='main'&&tab==='measurement')draw()}
function field(l,v){return `<div class="field"><span>${l}</span><span>${esc(v)}</span></div>`}
function draw(){drawReferenceChart()}
function setTab(t){tab=t;point=null;view='main';range=t==='events'?'month':'year';from=daysAgo(t==='events'?29:364);to=TODAY;render()}
function detail(id){returnView=view;selected=id;view='detail';render();window.scrollTo(0,0)}
function goBack(){if(view==='detail')view=returnView;else if(view==='history')view='main';else{toast('此原型仅演示成长功能');return}render()}
function switchBaby(){baby=1-baby;view='main';point=null;render()}
function openRange(){$('#from').value=from||babies[baby].birthday;$('#to').value=to;$('#to').max=TODAY;$('#from').max=TODAY;$('#range-error').textContent='';$('#range-dialog').showModal()}
function applyRange(){const a=$('#from').value,b=$('#to').value;if(!a||!b||a>b||b>TODAY){$('#range-error').textContent='请选择有效起止日期，结束日期不能晚于今天。';return}from=a;to=b;range='custom';point=null;$('#range-dialog').close();render()}
function formFields(){const k=$('#kind').value;$('#media-section').hidden=k==='measurement';$('#fields').innerHTML=k==='measurement'?`${Object.entries(metricLabels).map(([key,label])=>`<label for="${key}">${label}（${units[key]}，至少填写一项）</label><input type="number" step="0.1" min="0.1" id="${key}">`).join('')}<label for="method">身高测量方法</label><select id="method"><option value="">请选择（填写身高时必选）</option><option value="lying">卧位身长</option><option value="standing">站立身高</option></select><label for="source">测量来源</label><select id="source"><option>家庭测量</option><option>机构测量</option></select><p class="sheet-note">头围使用软尺测量所得数值；不将头围方法与身高方法混用。</p>`:'<label for="title">事件标题</label><input id="title" maxlength="50" required placeholder="记录一个第一次或学习新变化">'}
function openForm(k,id){if(!canAdd())return;const r=id?current().find(r=>r.id===id):null;if(r&&!canEdit(r))return;draftMedia=(r?.media||[]).map(m=>({...m}));editing=id||null;$('#form-title').textContent=id?'编辑成长记录':'新增成长记录';$('#kind').value=k;$('#kind').disabled=Boolean(id);formFields();$('#description').value=r?.description||'';$('#when').value=r?.when||TODAY+'T09:00';if(r){if(k==='measurement'){Object.keys(metricLabels).forEach(key=>$('#'+key).value=r[key]??'');$('#method').value=r.method==='unknown'?'':r.method;$('#source').value=r.source||'家庭测量'}else $('#title').value=r.title}$('#form-error').textContent='';$('#media-warning').textContent='';renderDraftMedia();$('#form-dialog').showModal()}
function closeForm(){if(confirm('关闭后将放弃未保存的内容，确定吗？')){discardDraft();$('#form-dialog').close()}}
function save(event){event.preventDefault();if(!canAdd())return;const old=editing?current().find(r=>r.id===editing):null;if(old&&!canEdit(old))return;const k=$('#kind').value,when=$('#when').value,fail=t=>$('#form-error').textContent=t;if(!when||new Date(when+'+08:00')>NOW||when.slice(0,10)<babies[baby].birthday)return fail('发生时间需在宝宝出生后，且不能晚于现在。');const r={id:editing||'new-'+Date.now(),baby:babies[baby].id,kind:k,when,author:old?.author||'妈妈',description:$('#description').value.trim()};if(k==='measurement'){let has=false;for(const key of Object.keys(metricLabels)){const v=$('#'+key).value;if(v){if(!(Number(v)>0))return fail('测量值需大于0。');r[key]=Number(v);has=true}}if(!has)return fail('身高、体重、头围至少填写一项。');if(r.height&&!$('#method').value)return fail('填写身高时，请选择卧位身长或站立身高。');r.method=$('#method').value||'unknown';r.source=$('#source').value}else{r.title=$('#title').value.trim();if(!r.title)return fail('请填写事件标题。')}if(k!=='measurement'){if(draftMedia.length>10)return fail('照片与视频合计最多10个。');r.media=draftMedia.map(m=>({...m}))}const oldMedia=old?.media||[];records=records.filter(x=>x.id!==r.id);records.push(r);oldMedia.filter(m=>!(r.media||[]).some(n=>n.url===m.url)).forEach(m=>URL.revokeObjectURL(m.url));draftMedia.forEach(m=>{if(!(r.media||[]).some(n=>n.url===m.url)&&!records.some(x=>(x.media||[]).some(n=>n.url===m.url)))URL.revokeObjectURL(m.url)});draftMedia=[];$('#form-dialog').close();if(editing){selected=r.id;view='detail'}else{view='main';tab=k==='measurement'?'measurement':'events';type='all';from='';to=TODAY;range='all'}render();toast('记录已保存（演示）')}
function removeRecord(){const r=current().find(r=>r.id===selected);if(!r||!canEdit(r))return;if(confirm('确定删除这条成长记录吗？')){(r.media||[]).forEach(m=>URL.revokeObjectURL(m.url));records=records.filter(x=>x.id!==r.id);view=returnView;render();toast('已删除演示记录')}}
function mediaTile(m,index,editable){return `<div class="media-tile"><button class="media-thumb" type="button" aria-label="预览${esc(m.name)}" onclick="openMediaPreview(${index},${editable})">${m.type==='video'?`<video src="${esc(m.url)}" preload="metadata" muted playsinline onerror="this.hidden=true;this.parentElement.nextElementSibling.hidden=false"></video>`:`<img src="${esc(m.url)}" alt="${esc(m.name)}" onerror="this.hidden=true;this.parentElement.nextElementSibling.hidden=false">`}</button><span class="media-error" hidden>无法预览，点击尝试打开或移除此项</span><span class="media-type">${m.type==='video'?'视频':'照片'}</span>${editable?`<button class="media-remove" type="button" aria-label="移除${esc(m.name)}" onclick="removeDraftMedia(${index})">移除</button>`:''}<div class="media-filename">${esc(m.name)}</div></div>`}
function renderDraftMedia(){$('#media-count').textContent=draftMedia.length+' / 10';$('#media-draft').innerHTML=draftMedia.map((m,i)=>mediaTile(m,i,true)).join('');$('#media-add').disabled=draftMedia.length>=10;$('#media-add').textContent=draftMedia.length>=10?'已达10个上限，移除后可继续添加':'添加照片 / 视频'}
function chooseMedia(input){if(!canAdd()){input.value='';return}let unsupported=0,empty=0,overflow=0,added=0;for(const file of Array.from(input.files||[])){if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){unsupported++;continue}if(!file.size){empty++;continue}if(draftMedia.length>=10){overflow++;continue}draftMedia.push({id:'media-'+(++mediaCounter),name:file.name,type:file.type.startsWith('video/')?'video':'image',url:URL.createObjectURL(file)});added++}input.value='';$('#media-warning').textContent=[unsupported?unsupported+'个非照片/视频文件未添加。':'',empty?empty+'个空文件未添加。':'',overflow?'超过10个上限，'+overflow+'个文件未添加。':''].filter(Boolean).join(' ');renderDraftMedia();if(added)toast('已选择'+added+'个媒体文件（本机预览）')}
function removeDraftMedia(index){const [m]=draftMedia.splice(index,1);if(m&&!records.some(r=>(r.media||[]).some(n=>n.url===m.url)))URL.revokeObjectURL(m.url);$('#media-warning').textContent='';renderDraftMedia()}
function discardDraft(){draftMedia.forEach(m=>{if(!records.some(r=>(r.media||[]).some(n=>n.url===m.url)))URL.revokeObjectURL(m.url)});draftMedia=[]}
function openMediaPreview(index,isDraft){previewMedia=isDraft?draftMedia:current().find(r=>r.id===selected)?.media||[];if(!previewMedia[index])return;previewIndex=index;renderPreview();$('#media-preview').showModal()}
function renderPreview(){const m=previewMedia[previewIndex];if(!m)return;$('#preview-body').innerHTML=m.type==='video'?`<video class="preview-content" src="${esc(m.url)}" controls playsinline onerror="this.nextElementSibling.hidden=false"></video><p class="media-error" hidden>此浏览器无法播放该视频，请更换浏览器支持的格式。</p>`:`<img class="preview-content" src="${esc(m.url)}" alt="${esc(m.name)}" onerror="this.nextElementSibling.hidden=false"><p class="media-error" hidden>此浏览器无法显示该照片，请更换浏览器支持的格式。</p>`;$('#preview-position').textContent=(previewIndex+1)+' / '+previewMedia.length;$('#preview-name').textContent=m.name;$('#preview-prev').disabled=previewIndex===0;$('#preview-next').disabled=previewIndex===previewMedia.length-1}
function movePreview(step){const next=previewIndex+step;if(next<0||next>=previewMedia.length)return;previewIndex=next;renderPreview()}
function closeMediaPreview(){$('#preview-body').innerHTML='';$('#media-preview').close()}
$('#media-preview').addEventListener('close',()=>{$('#preview-body').innerHTML='' });
$('#form-dialog').addEventListener('cancel',event=>{event.preventDefault();closeForm()});
function toast(t){const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
from=daysAgo(364);render();
</script></body></html>
